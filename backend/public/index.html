}

// ── Seeding ──────────────────────────────────────────────────────
function Seeding({ t, lang, user }) {
  const [form, setForm] = useState({
    name: '',
    email: '',
    department: '',
    accessLevel: '1',
    username: '',
    password: '',
  });
  const [loading, setLoading] = useState(false);
  const [success, setSuccess] = useState(null);
  const [error, setError] = useState(null);

  if (user?.accessLevel < 4) {
    return (
      <div className="card" style={{ padding: '40px', textAlign: 'center' }}>
        <h2 style={{ color: 'var(--danger)', fontSize: '20px', fontWeight: 600 }}>Access Denied</h2>
        <p style={{ color: 'var(--text-muted)', marginTop: '8px' }}>You do not have permission to view this page.</p>
      </div>
    );
  }

  const handleChange = (e) => {
    setForm({ ...form, [e.target.name]: e.target.value });
  };

  const handleSubmit = async (e) => {
    e.preventDefault();
    setLoading(true);
    setError(null);
    setSuccess(null);
    try {
      const res = await authFetch(`${API}/api/admin/seed-user`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(form),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Request failed');
      setSuccess(data);
      setForm({
        name: '',
        email: '',
        department: '',
        accessLevel: '1',
        username: '',
        password: '',
      });
    } catch (err) {
      setError(err.message);
    } finally {
      setLoading(false);
    }
  };

  const getAccessLabel = (lvl) => {
    if (lvl === 4) return lang === 'ar' ? 'المستوى 4 (الإدارة التنفيذية)' : 'Level 4 (Executive Management)';
    if (lvl === 3) return lang === 'ar' ? 'المستوى 3+ (نواب الرئيس والمدراء الكبار)' : 'Level 3+ (VPs & Senior Managers)';
    if (lvl === 2) return lang === 'ar' ? 'المستوى 2+ (المدراء والمشرفين)' : 'Level 2+ (Managers & Supervisors)';
    return lang === 'ar' ? 'المستوى 1+ (جميع الموظفين)' : 'Level 1+ (All Employees)';
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: '24px' }}>
      {/* Success Card */}
      {success && (
        <div className="card" style={{ padding: '24px', border: '1px solid var(--success)', borderLeft: '4px solid var(--success)' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: '10px', color: 'var(--success)', marginBottom: '16px' }}>
            <i className="fa-solid fa-circle-check" style={{ fontSize: '20px' }} aria-hidden="true"></i>
            <h3 style={{ fontSize: '16px', fontWeight: 700 }}>{t('seedingSuccess')}</h3>
          </div>
          <div className="form-row" style={{ fontSize: '13px', rowGap: '12px' }}>
            <div>
              <span style={{ color: 'var(--text-muted)' }}>{t('seedingFullName')}: </span>
              <strong style={{ color: 'var(--text)' }}>{success.member?.name}</strong>
            </div>
            <div>
              <span style={{ color: 'var(--text-muted)' }}>{t('seedingEmail')}: </span>
              <strong style={{ color: 'var(--text)' }}>{success.member?.email}</strong>
            </div>
            <div>
              <span style={{ color: 'var(--text-muted)' }}>{t('seedingDept')}: </span>
              <strong style={{ color: 'var(--text)' }}>{success.member?.departmentId || '—'}</strong>
            </div>
            <div>
              <span style={{ color: 'var(--text-muted)' }}>{t('seedingAccessLevel')}: </span>
              <strong style={{ color: 'var(--text)' }}>{getAccessLabel(parseInt(success.member?.role === 'CEO' ? 4 : success.member?.role === 'SeniorManager' ? 3 : success.member?.role === 'DepartmentManager' ? 2 : 1))}</strong>
            </div>
            <div>
              <span style={{ color: 'var(--text-muted)' }}>{t('seedingUsername')}: </span>
              <strong style={{ color: 'var(--text)', fontFamily: 'monospace' }}>{success.username}</strong>
            </div>
            <div>
              <span style={{ color: 'var(--text-muted)' }}>{t('seedingPassword')}: </span>
              <strong style={{ color: 'var(--text)', fontFamily: 'monospace' }}>{success.password}</strong>
            </div>
          </div>
          <button
            onClick={() => setSuccess(null)}
            className="btn btn-ghost btn-sm"
            style={{ marginTop: '16px', padding: '6px 16px', background: 'rgba(34,197,94,0.1)', color: 'var(--success)', border: '1px solid rgba(34,197,94,0.3)', borderRadius: '8px', cursor: 'pointer' }}
          >
            {lang === 'ar' ? 'إغلاق الإشعار' : 'Dismiss'}
          </button>
        </div>
      )}

      {/* Error Card */}
      {error && (
        <div className="card" style={{ padding: '24px', border: '1px solid var(--danger)', borderLeft: '4px solid var(--danger)' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: '10px', color: 'var(--danger)', marginBottom: '8px' }}>
            <i className="fa-solid fa-circle-exclamation" style={{ fontSize: '20px' }} aria-hidden="true"></i>
            <h3 style={{ fontSize: '16px', fontWeight: 700 }}>{t('seedingError')}</h3>
          </div>
          <p style={{ color: 'var(--text)', fontSize: '13px' }}>{error}</p>
          <button
            onClick={() => setError(null)}
            className="btn btn-ghost btn-sm"
            style={{ marginTop: '16px', padding: '6px 16px', background: 'rgba(239,68,68,0.1)', color: 'var(--danger)', border: '1px solid rgba(239,68,68,0.3)', borderRadius: '8px', cursor: 'pointer' }}
          >
            {lang === 'ar' ? 'إغلاق الإشعار' : 'Dismiss'}
          </button>
        </div>
      )}

      {/* Form Card */}
      {!success && (
        <div className="card" style={{ padding: '28px' }}>
          <div className="section-title" style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '24px' }}>
            <i className="fa-solid fa-server" style={{ color: 'var(--accent)' }} aria-hidden="true"></i>
            {t('seedingFormTitle')}
          </div>
          <form onSubmit={handleSubmit}>
            <div className="form-row">
              <div className="form-group">
                <label>{t('seedingFullName')}</label>
                <input
                  type="text"
                  name="name"
                  value={form.name}
                  onChange={handleChange}
                  required
                  placeholder="John Doe"
                  style={{ width: '100%', padding: '10px 14px', background: 'var(--bg-input)', border: '1px solid var(--border)', borderRadius: 'var(--radius-sm)', color: 'var(--text)' }}
                />
              </div>
              <div className="form-group">
                <label>{t('seedingEmail')}</label>
                <input
                  type="email"
                  name="email"
                  value={form.email}
                  onChange={handleChange}
                  required
                  placeholder="john.doe@company.com"
                  style={{ width: '100%', padding: '10px 14px', background: 'var(--bg-input)', border: '1px solid var(--border)', borderRadius: 'var(--radius-sm)', color: 'var(--text)' }}
                />
              </div>
            </div>

            <div className="form-row">
              <div className="form-group">
                <label>{t('seedingDept')}</label>
                <input
                  type="text"
                  name="department"
                  value={form.department}
                  onChange={handleChange}
                  placeholder="e.g. Finance"
                  style={{ width: '100%', padding: '10px 14px', background: 'var(--bg-input)', border: '1px solid var(--border)', borderRadius: 'var(--radius-sm)', color: 'var(--text)' }}
                />
              </div>
              <div className="form-group">
                <label>{t('seedingAccessLevel')}</label>
                <select
                  name="accessLevel"
                  value={form.accessLevel}
                  onChange={handleChange}
                  required
                  style={{ width: '100%', padding: '10px 14px', background: 'var(--bg-input)', border: '1px solid var(--border)', borderRadius: 'var(--radius-sm)', color: 'var(--text)' }}
                >
                  <option value="1">{t('seedingAccess1')}</option>
                  <option value="2">{t('seedingAccess2')}</option>
                  <option value="3">{t('seedingAccess3')}</option>
                  <option value="4">{t('seedingAccess4')}</option>
                </select>
              </div>
            </div>

            <div className="form-row">
              <div className="form-group">
                <label>{t('seedingUsername')}</label>
                <input
                  type="text"
                  name="username"
                  value={form.username}
                  onChange={handleChange}
                  placeholder={lang === 'ar' ? 'اختياري - بادئة البريد بشكل تلقائي' : 'Optional - email prefix by default'}
                  style={{ width: '100%', padding: '10px 14px', background: 'var(--bg-input)', border: '1px solid var(--border)', borderRadius: 'var(--radius-sm)', color: 'var(--text)' }}
                />
              </div>
              <div className="form-group">
                <label>{t('seedingPassword')}</label>
                <input
                  type="text"
                  name="password"
                  value={form.password}
                  onChange={handleChange}
                  placeholder={lang === 'ar' ? 'اختياري - Pass123 بشكل تلقائي' : 'Optional - Pass123 by default'}
                  style={{ width: '100%', padding: '10px 14px', background: 'var(--bg-input)', border: '1px solid var(--border)', borderRadius: 'var(--radius-sm)', color: 'var(--text)' }}
                />
              </div>
            </div>

            <div style={{ display: 'flex', justifyContent: 'flex-end', marginTop: '16px' }}>
              <button
                type="submit"
                disabled={loading}
                className="btn btn-primary"
                style={{ minWidth: '160px', padding: '12px 24px', fontWeight: 600, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px' }}
              >
                {loading ? (
                  <>
                    <i className="fa-solid fa-circle-notch fa-spin"></i>
                    {lang === 'ar' ? 'جاري التسجيل...' : 'Processing...'}
                  </>
                ) : (
                  <>
                    <i className="fa-solid fa-server"></i>
                    {t('seedingSubmit')}
                  </>
                )}
              </button>
            </div>
          </form>
        </div>
      )}
    </div>
  );
}

// ── App ──────────────────────────────────────────────────────────
function App() {
  const [user, setUser]         = useState(() => {
    try {
      const u = JSON.parse(localStorage.getItem('tcm_user'));
      const tok = localStorage.getItem('tcm_token');
      if (u && !tok) { localStorage.removeItem('tcm_user'); return null; }
      return u;
    } catch { return null; }
  });
  const [page, setPage]         = useState('dashboard');
  const [stats, setStats]       = useState({});
  const [members, setMembers]   = useState([]);
  const [tasks, setTasks]       = useState([]);
  const [news, setNews]         = useState([]);
  const [messages, setMessages] = useState([]);
  const [loading, setLoading]   = useState(true);
  const [lang, setLang]         = useState('ar'); // Arabic as primary default language!
  const [theme, setTheme]       = useState(() => localStorage.getItem('tcm_theme') || 'dark');

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('tcm_theme', theme);
  }, [theme]);

  const handleLogin  = (u) => { setUser(u); setPage('dashboard'); };
  const handleLogout = () => {
    localStorage.removeItem('tcm_user');
    localStorage.removeItem('tcm_token');
    setUser(null); setPage('dashboard');
    setStats({}); setMembers([]); setTasks([]); setMessages([]); setNews([]);
  };

  useEffect(() => {
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.documentElement.lang = lang;
    document.body.classList.toggle('rtl', lang === 'ar');
  }, [lang]);

  const t = (key, params = {}) => {
    let text = locales[lang]?.[key] || locales['en']?.[key] || key;
    Object.keys(params).forEach(p => {
      text = text.replace(`{${p}}`, params[p]);
    });
    return text;
  };

  useEffect(() => {
    if (!user) return;
    setLoading(true);
    Promise.all([
      authFetch(`${API}/api/dashboard`).then(r => r.json()),
      authFetch(`${API}/api/messages`).then(r => r.json()),
      authFetch(`${API}/api/members`).then(r => r.json()),
      authFetch(`${API}/api/tasks`).then(r => r.json()),
    ]).then(([dash, msg, m, tData]) => {
      setStats(dash.stats);
      setNews(dash.news);
      setMembers(m);
      setTasks(tData);
      setMessages(msg);
      setLoading(false);
    })
    .catch(() => setLoading(false));
  }, [user]);

  useEffect(() => {
    if (!user) return;
    authFetch(`${API}/api/dashboard`).then(r => r.json()).then(dash => {
      setStats(dash.stats);
      setNews(dash.news);
    });
  }, [members, tasks]);

  const getPageKey = (page, suffix) => {
    const base = page === 'orgchart' ? 'orgChart' : page === 'newsapprovals' ? 'newsApprovals' : page;
    return base + suffix;
  };

  if (!user) return <Login onLogin={handleLogin} t={t} lang={lang} />;

  return (
    <div className="layout">
      <Sidebar page={page} setPage={setPage} user={user} onLogout={handleLogout} t={t} lang={lang} />
      <div className="main">
        <header className="topbar">
          <div className="topbar-left">
            <h1>{t(getPageKey(page, 'Title'))}</h1>
            <p>{t(getPageKey(page, 'Subtitle'))}</p>
          </div>
          <div className="topbar-right">
            <div className="theme-toggle" role="group" aria-label="Theme">
              <button className={`theme-btn${theme==='dark'?' active':''}`} onClick={() => setTheme('dark')}>
                <i className="fa-solid fa-moon"></i>
                <span>{lang==='ar'?'داكن':'Dark'}</span>
              </button>
              <button className={`theme-btn${theme==='light'?' active':''}`} onClick={() => setTheme('light')}>
                <i className="fa-solid fa-sun"></i>
                <span>{lang==='ar'?'فاتح':'Light'}</span>
              </button>
            </div>
            <button className="btn btn-ghost btn-sm" onClick={() => setLang(l => l === 'ar' ? 'en' : 'ar')} aria-label="Toggle language">
              <i className="fa-solid fa-globe" style={{ marginInlineEnd: 4, marginInlineStart: 4 }}></i>
              {lang === 'ar' ? 'EN' : 'AR'}
            </button>
            <div className="topbar-date" aria-label="Current date">
              <i className="fa-regular fa-calendar" aria-hidden="true" style={{ marginInlineEnd: 6, marginInlineStart: 6 }}></i>
              {new Date().toLocaleDateString(lang === 'ar' ? 'ar-EG' : 'en-US', {weekday:'short',month:'short',day:'numeric'})}
            </div>
          </div>
        </header>
        <main className="content">
          {loading
            ? <div style={{textAlign:'center',padding:80,color:'var(--text-dim)'}} role="status" aria-label={t('loading')}>
                <i className="fa-solid fa-circle-notch fa-spin" style={{fontSize:28,color:'var(--accent)'}} aria-hidden="true"></i>
                <p style={{marginTop:14,fontSize:13}}>{t('loading')}</p>
              </div>
            : page === 'dashboard' ? <Dashboard stats={stats} members={members} tasks={tasks} news={news} setNews={setNews} user={user} t={t} lang={lang} />
            : page === 'members'   ? <Members  members={members} setMembers={setMembers} t={t} lang={lang} />
            : page === 'tasks'     ? <Tasks    tasks={tasks} setTasks={setTasks} members={members} t={t} lang={lang} />
            : page === 'chat'      ? <Chat     messages={messages} setMessages={setMessages} user={user} t={t} lang={lang} />
            : page === 'orgchart'  ? <OrgChart t={t} lang={lang} members={members} user={user} />
            : page === 'newsapprovals' ? <NewsApprovals t={t} lang={lang} user={user} />
            : page === 'documents' ? <Documents t={t} lang={lang} user={user} />
            : page === 'seeding'   ? <Seeding t={t} lang={lang} user={user} />
            : null
          }
        </main>
      </div>
      <MobileNav page={page} setPage={setPage} t={t} />
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { err: null }; }
  static getDerivedStateFromError(e) { return { err: e }; }
  render() {
    if (this.state.err) {
      const e = this.state.err;
      return React.createElement('div', {
        style: { color:'#f87171', background:'#0a0a0a', padding:'24px', fontFamily:'monospace',
                 fontSize:'13px', whiteSpace:'pre-wrap', minHeight:'100vh', lineHeight:'1.6' }
      }, 'REACT ERROR\n\n' + e.message + '\n\n' + (e.stack||''));
    }
    return this.props.children;
  }
}
ReactDOM.createRoot(document.getElementById('root')).render(
  React.createElement(ErrorBoundary, null, React.createElement(App, null))
);
</script>
</body>
</html>
