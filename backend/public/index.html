// ── Dashboard ────────────────────────────────────────────────────
function Dashboard({ stats, members, tasks, news, setNews, user, t, lang }) {
  const recentMembers = [...members].reverse().slice(0,5);
  const recentTasks   = [...tasks].reverse().slice(0,5);
  
  const [modalOpen, setModalOpen] = useState(false);
  const [title, setTitle] = useState('');
  const [content, setContent] = useState('');
  const [tag, setTag] = useState('Notice');

  const statCards = [
    { label: t('totalMembers'),     value: stats.totalMembers    ?? 0, icon:'fa-solid fa-users',        cls:'blue'   },
    { label: t('activeMembers'),    value: stats.activeMembers   ?? 0, icon:'fa-solid fa-user-check',   cls:'green'  },
    { label: t('tasksInProgress'), value: stats.inProgressTasks ?? 0, icon:'fa-solid fa-spinner',      cls:'orange' },
    { label: t('completedTasks'),   value: stats.completedTasks  ?? 0, icon:'fa-solid fa-circle-check', cls:'purple' },
  ];

  const handlePostNews = async (e) => {
    e.preventDefault();
    if (!title || !content) return alert(lang === 'ar' ? 'العنوان والمحتوى مطلوبان.' : 'Title and content are required.');
    try {
      const res = await authFetch(`${API}/api/news`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          title,
          content,
          author: user?.name || 'Administrator',
          tags: [tag]
        })
      });
      const created = await res.json();
      if (created.status === 'approved') {
        setNews(prev => [created, ...prev]);
      } else {
        alert(lang === 'ar' ? t('newsPendingNotice') : t('newsPendingNotice'));
      }
      setTitle(''); setContent(''); setTag('Notice');
      setModalOpen(false);
    } catch {
      alert(lang === 'ar' ? 'فشل نشر الإعلان.' : 'Failed to post announcement.');
    }
  };

  const handleDeleteNews = async (id) => {
    if (!confirm(lang === 'ar' ? 'هل أنت متأكد من حذف هذا الإعلان؟' : 'Are you sure you want to delete this announcement?')) return;
    try {
      const res = await authFetch(`${API}/api/news/${id}`, { method: 'DELETE' });
      if (!res.ok) { const e = await res.json().catch(() => ({})); return alert(e.error || (lang === 'ar' ? 'فشل حذف الإعلان.' : 'Failed to delete announcement.')); }
      setNews(prev => prev.filter(n => n.id !== id));
    } catch {
      alert(lang === 'ar' ? 'فشل حذف الإعلان.' : 'Failed to delete announcement.');
    }
  };

  const getTagClass = (tag) => {
    const t = (tag || '').toLowerCase();
    if (t === 'system') return 'tag-system';
    if (t === 'notice') return 'tag-notice';
    if (t === 'finance') return 'tag-finance';
    if (t === 'campaign') return 'tag-campaign';
    if (t === 'audit') return 'tag-audit';
    return 'tag-general';
  };

  const canManageNews = (user?.accessLevel || 0) >= 1;

  return (
    <div>
      <div className="stat-grid">
        {statCards.map(s => (
          <div className={`stat-card ${s.cls}`} key={s.label}>
            <div className="stat-top">
              <span className="stat-label">{s.label}</span>
              <div className={`stat-icon-wrap ${s.cls}`} aria-hidden="true"><i className={s.icon}></i></div>
            </div>
            <div className="stat-value" aria-label={`${s.label}: ${s.value}`}>{s.value}</div>
          </div>
        ))}
      </div>

      <div className="dash-grid-three" style={{ marginTop: '24px' }}>
        
        {/* Widget 1: News Board */}
        <div className="card" style={{ padding: '20px', display: 'flex', flexDirection: 'column' }}>
          <div className="section-title" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '18px' }}>
            <span>
              <i className="fa-solid fa-bullhorn" style={{ marginRight: '8px', marginLeft: '8px', color: 'var(--accent)' }} aria-hidden="true"></i>
              {t('newsBoard')}
            </span>
            {canManageNews && (
              <button className="btn btn-primary btn-sm" onClick={() => setModalOpen(true)}>
                <i className="fa-solid fa-plus" aria-hidden="true"></i> {t('post')}
              </button>
            )}
          </div>
          
          <div className="news-board">
            {news.length === 0 ? (
              <div className="empty-state">
                <i className="fa-regular fa-newspaper" aria-hidden="true"></i>
                <p>{t('noNews')}</p>
              </div>
            ) : (
              news.map(item => (
                <article className="news-item" key={item.id}>
                  <div className="news-header">
                    <h4 className="news-title">{item.title}</h4>
                    <div style={{ display: 'flex', gap: '6px', alignItems: 'center' }}>
                      {item.tags && item.tags.map(t => (
                        <span key={t} className={`tag ${getTagClass(t)}`}>{t}</span>
                      ))}
                      {canManageNews && (
                        <button 
                          className="btn-icon" 
                          onClick={() => handleDeleteNews(item.id)} 
                          style={{ background: 'transparent', border: 'none', color: 'var(--text-dim)', cursor: 'pointer', padding: '2px 4px', fontSize: '11px' }}
                          title="Delete announcement"
                        >
                          <i className="fa-solid fa-trash-can" aria-hidden="true"></i>
                        </button>
                      )}
                    </div>
                  </div>
                  <p className="news-content">{item.content}</p>
                  <div className="news-meta">
                    <span><i className="fa-solid fa-user-pen" style={{ marginRight: '4px', marginLeft: '4px' }} aria-hidden="true"></i> {item.author}</span>
                    <span>·</span>
                    <span><i className="fa-regular fa-clock" style={{ marginRight: '4px', marginLeft: '4px' }} aria-hidden="true"></i> {item.date}</span>
                  </div>
                </article>
              ))
            )}
          </div>
        </div>

        {/* Widget 2: Recent Members */}
        <div className="card" style={{ padding: '20px' }}>
          <div className="section-title" style={{ marginBottom: '18px' }}>
            <i className="fa-solid fa-user-plus" style={{ marginRight: '8px', marginLeft: '8px', color: 'var(--success)' }} aria-hidden="true"></i>
            {t('recentMembers')}
          </div>
          {recentMembers.length === 0
            ? <div className="empty-state"><i className="fa-solid fa-users" aria-hidden="true"></i><p>{t('noMembers')}</p></div>
            : <ul className="activity-list" aria-label="Recent members">
                {recentMembers.map(m => (
                  <li className="activity-item" key={m.id}>
                    <div className={`avatar ${getColor(m.name)}`} style={{width:28,height:28,fontSize:10,marginTop:2}} aria-hidden="true">{initials(m.name)}</div>
                    <div>
                      <div className="activity-text"><strong>{m.name}</strong> — {tRole(m.role, lang)}</div>
                      <div className="activity-time">
                        {t('joined')} {m.joinDate}
                        <span className={`badge badge-${m.status.toLowerCase()}`}>{m.status === 'Active' ? t('statusActive') : t('statusInactive')}</span>
                      </div>
                    </div>
                  </li>
                ))}
              </ul>
          }
        </div>

        {/* Widget 3: Recent Tasks */}
        <div className="card" style={{ padding: '20px' }}>
          <div className="section-title" style={{ marginBottom: '18px' }}>
            <i className="fa-solid fa-list-check" style={{ marginRight: '8px', marginLeft: '8px', color: 'var(--warning)' }} aria-hidden="true"></i>
            {t('recentTasks')}
          </div>
          {recentTasks.length === 0
            ? <div className="empty-state"><i className="fa-solid fa-check-to-slot" aria-hidden="true"></i><p>{t('noTasks')}</p></div>
            : <ul className="activity-list" aria-label="Recent tasks">
                {recentTasks.map(tData => (
                  <li className="activity-item" key={tData.id}>
                    <div className="activity-dot" style={{background: tData.status==='done'?'var(--success)':tData.status==='inprogress'?'var(--warning)':'var(--accent)'}} aria-hidden="true"></div>
                    <div>
                      <div className="activity-text"><strong>{tData.title}</strong></div>
                      <div className="activity-time">
                        {tData.assignee && <>{tData.assignee} · </>}{t('due')} {tData.dueDate}
                        <span className={`badge badge-${tData.priority.toLowerCase()}`}>{tData.priority === 'High' ? t('priorityHigh') : tData.priority === 'Medium' ? t('priorityMedium') : t('priorityLow')}</span>
                      </div>
                    </div>
                  </li>
                ))}
              </ul>
          }
        </div>
      </div>

      {/* Post Announcement Modal */}
      {modalOpen && (
        <div className="modal-overlay" onClick={() => setModalOpen(false)} role="dialog" aria-modal="true" aria-labelledby="news-modal-title">
          <form className="modal" onClick={e => e.stopPropagation()} onSubmit={handlePostNews}>
            <div className="modal-header">
              <h3 id="news-modal-title">{t('postAnnouncement')}</h3>
              <button type="button" className="btn btn-ghost btn-sm btn-icon" onClick={() => setModalOpen(false)} aria-label="Close dialog">
                <i className="fa-solid fa-times" aria-hidden="true"></i>
              </button>
            </div>
            <div className="modal-body">
              <div className="form-group">
                <label htmlFor="ann-title">{t('annTitle')}</label>
                <input id="ann-title" value={title} onChange={e => setTitle(e.target.value)} placeholder="e.g. System Maintenance Window" autoFocus required />
              </div>
              <div className="form-group">
                <label htmlFor="ann-content">{t('annContent')}</label>
                <textarea id="ann-content" value={content} onChange={e => setContent(e.target.value)} placeholder="Describe the announcement in detail..." required style={{ minHeight: '120px' }} />
              </div>
              <div className="form-group">
                <label htmlFor="ann-tag">{t('annTag')}</label>
                <select id="ann-tag" value={tag} onChange={e => setTag(e.target.value)}>
                  <option value="Notice">Notice</option>
                  <option value="System">System</option>
                  <option value="Finance">Finance</option>
                  <option value="Campaign">Campaign</option>
                  <option value="Audit">Audit</option>
                </select>
              </div>
            </div>
            <div className="modal-footer">
              <button type="button" className="btn btn-ghost" onClick={() => setModalOpen(false)}>{t('cancel')}</button>
              <button type="submit" className="btn btn-primary">
                <i className="fa-solid fa-bullhorn" aria-hidden="true"></i> {t('submitAnnouncement')}
              </button>
            </div>
          </form>
        </div>
      )}
    </div>
  );
}

// ── Members ──────────────────────────────────────────────────────
const ROLES_9 = ['CEO','President','VicePresident','Advisor','SeniorManager','DepartmentManager','Supervisor','TeamLeader','DepartmentMember'];
function roleBadgeCls(role) { const l = clientLevelOf(role); return l>=4?'lv4':l>=3?'lv3':l>=2?'lv2':'lv1'; }
const emptyMember = { name:'', email:'', phone:'', role:'DepartmentMember', secondaryRole:null, status:'Active', departmentId:'', reportsToId:null };

function Members({ members, setMembers, t, lang }) {
  const [search, setSearch]                   = useState('');
  const [modal, setModal]                     = useState(false);
  const [editing, setEditing]                 = useState(null);
  const [form, setForm]                       = useState(emptyMember);
  const [departments, setDepartments]         = useState([]);
  const [eligibleManagers, setEligibleManagers] = useState([]);
  const [managersLoading, setManagersLoading] = useState(false);

  // Load departments once on mount
  useEffect(() => {
    authFetch(`${API}/api/departments`)
      .then(r => r.json())
      .then(setDepartments)
      .catch(() => {});
  }, []);

  // Reload eligible managers whenever role changes while modal is open
  useEffect(() => {
    if (!modal) return;
    setManagersLoading(true);
    authFetch(`${API}/api/members/eligible-managers?role=${form.role}`)
      .then(r => r.json())
      .then(data => { setEligibleManagers(data); setManagersLoading(false); })
      .catch(() => setManagersLoading(false));
  }, [form.role, modal]);

  const getDeptName = (id) => {
    const d = departments.find(x => x.id === id);
    if (!d) return '';
    return lang === 'ar' ? (d.nameAr || d.name) : d.name;
  };

  const filtered = members.filter(m =>
    m.name.toLowerCase().includes(search.toLowerCase()) ||
    m.email.toLowerCase().includes(search.toLowerCase()) ||
    m.role.toLowerCase().includes(search.toLowerCase())
  );

  const openAdd  = ()  => { setEditing(null); setForm(emptyMember); setEligibleManagers([]); setModal(true); };
  const openEdit = (m) => { setEditing(m); setForm({...m}); setEligibleManagers([]); setModal(true); };
  const close    = ()  => setModal(false);

  const handleSave = async () => {
    if (!form.name || !form.email) return alert(lang === 'ar' ? 'الاسم والبريد الإلكتروني مطلوبان.' : 'Name and email are required.');
    const payload = { ...form, reportsToId: form.reportsToId ? parseInt(form.reportsToId) : null };
    if (editing) {
      const res = await authFetch(`${API}/api/members/${editing.id}`, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
      if (!res.ok) { const e = await res.json(); return alert(e.error || 'Save failed'); }
      const updated = await res.json();
      setMembers(prev => prev.map(m => m.id === editing.id ? updated : m));
    } else {
      const res = await authFetch(`${API}/api/members`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
      if (!res.ok) { const e = await res.json(); return alert(e.error || 'Save failed'); }
      const created = await res.json();
      setMembers(prev => [...prev, created]);
    }
    close();
  };

  const handleDelete = async (id, name) => {
    if (!confirm(t('confirmDeleteMember', { name }))) return;
    const res = await authFetch(`${API}/api/members/${id}`, { method:'DELETE' });
    if (!res.ok) { const e = await res.json().catch(() => ({})); return alert(e.error || (lang === 'ar' ? 'فشل الحذف' : 'Delete failed')); }
    setMembers(prev => prev.filter(m => m.id !== id));
  };

  return (
    <div>
      <div className="toolbar">
        <div className="search-bar" role="search">
          <i className="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
          <input placeholder={t('searchMembers')} value={search}
            onChange={e => setSearch(e.target.value)} aria-label="Search members" />
        </div>
        <button className="btn btn-primary" onClick={openAdd}>
          <i className="fa-solid fa-plus" aria-hidden="true"></i> {t('addMember')}
        </button>
      </div>
      <div className="table-wrap">
        <table>
          <thead>
            <tr>
              <th scope="col">{t('colMember')}</th>
              <th scope="col">{t('colEmail')}</th>
              <th scope="col">{t('colPhone')}</th>
              <th scope="col">{lang === 'ar' ? 'القسم' : 'Department'}</th>
              <th scope="col">{t('colRole')}</th>
              <th scope="col">{lang === 'ar' ? 'المستوى' : 'LEVEL'}</th>
              <th scope="col">{t('colStatus')}</th>
              <th scope="col">{t('colJoined')}</th>
              <th scope="col">{t('colActions')}</th>
            </tr>
          </thead>
          <tbody>
            {filtered.length === 0
              ? <tr><td colSpan={9} style={{textAlign:'center',padding:40,color:'var(--text-dim)'}}>{t('noMembersFound')}</td></tr>
              : filtered.map(m => (
                <tr key={m.id}>
                  <td>
                    <div className="member-cell">
                      <div className={`avatar ${getColor(m.name)}`} aria-hidden="true">{initials(m.name)}</div>
                      <span className="member-name">{m.name}</span>
                    </div>
                  </td>
                  <td style={{color:'var(--text-muted)'}}>{m.email}</td>
                  <td style={{color:'var(--text-muted)',fontFamily:'Fira Code, monospace',fontSize:13}}>{m.phone}</td>
                  <td style={{color:'var(--text-muted)',fontSize:13}}>{getDeptName(m.departmentId) || <span style={{color:'var(--text-dim)'}}>—</span>}</td>
                  <td>
                    <span className={`badge badge-${roleBadgeCls(m.role)}`}>{tRole(m.role, lang)}</span>
                    {m.secondaryRole && <span className={`badge badge-${roleBadgeCls(m.secondaryRole)}`} style={{marginInlineStart:4,opacity:0.75}}>{tRole(m.secondaryRole, lang)}</span>}
                  </td>
                  <td><LevelBar level={Math.max(clientLevelOf(m.role), clientLevelOf(m.secondaryRole||''))} /></td>
                  <td><span className={`badge badge-${m.status.toLowerCase()}`}>{m.status === 'Active' ? t('statusActive') : t('statusInactive')}</span></td>
                  <td style={{color:'var(--text-dim)',fontFamily:'Fira Code, monospace',fontSize:13}}>{m.joinDate}</td>
                  <td>
                    <div style={{display:'flex',gap:6}}>
                      <button className="btn btn-ghost btn-sm btn-icon" onClick={() => openEdit(m)} aria-label={`Edit ${m.name}`}>
                        <i className="fa-solid fa-pen" aria-hidden="true"></i>
                      </button>
                      <button className="btn btn-danger btn-sm btn-icon" onClick={() => handleDelete(m.id, m.name)} aria-label={`Delete ${m.name}`}>
                        <i className="fa-solid fa-trash" aria-hidden="true"></i>
                      </button>
                    </div>
                  </td>
                </tr>
              ))
            }
          </tbody>
        </table>
      </div>

      {modal && (
        <div className="modal-overlay" onClick={close} role="dialog" aria-modal="true" aria-labelledby="modal-title">
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h3 id="modal-title">{editing ? t('editMember') : t('addNewMember')}</h3>
              <button className="btn btn-ghost btn-sm btn-icon" onClick={close} aria-label="Close dialog">
                <i className="fa-solid fa-times" aria-hidden="true"></i>
              </button>
            </div>
            <div className="modal-body">
              <div className="form-row">
                <div className="form-group">
                  <label htmlFor="m-name">{t('fullName')}</label>
                  <input id="m-name" value={form.name} onChange={e => setForm({...form,name:e.target.value})} placeholder="Aung Kyaw" autoFocus />
                </div>
                <div className="form-group">
                  <label htmlFor="m-email">{t('colEmail')} *</label>
                  <input id="m-email" type="email" value={form.email} onChange={e => setForm({...form,email:e.target.value})} placeholder="email@thuriban.com" />
                </div>
              </div>
              <div className="form-row">
                <div className="form-group">
                  <label htmlFor="m-phone">{t('colPhone')}</label>
                  <input id="m-phone" value={form.phone} onChange={e => setForm({...form,phone:e.target.value})} placeholder="+95 9 xxx xxx xxx" />
                </div>
                <div className="form-group">
                  <label htmlFor="m-role">{t('colRole')}</label>
                  <select id="m-role" value={form.role} onChange={e => setForm({...form,role:e.target.value})}>
                    {ROLES_9.map(r => <option key={r} value={r}>{tRole(r, lang)}</option>)}
                  </select>
                </div>
              </div>
              <div className="form-row">
                <div className="form-group">
                  <label htmlFor="m-secondary-role">{lang === 'ar' ? 'المنصب الثانوي (اختياري)' : 'Secondary Role (optional)'}</label>
                  <select id="m-secondary-role" value={form.secondaryRole || ''} onChange={e => setForm({...form, secondaryRole: e.target.value || null})}>
                    <option value="">{lang === 'ar' ? '— بدون —' : '— None —'}</option>
                    {ROLES_9.filter(r => r !== form.role).map(r => <option key={r} value={r}>{tRole(r, lang)}</option>)}
                  </select>
                </div>
                <div className="form-group">
                  <label htmlFor="m-status">{t('colStatus')}</label>
                  <select id="m-status" value={form.status} onChange={e => setForm({...form,status:e.target.value})}>
                    <option value="Active">{t('statusActive')}</option>
                    <option value="Inactive">{t('statusInactive')}</option>
                  </select>
                </div>
              </div>
              <div className="form-row">
                <div className="form-group">
                  <label htmlFor="m-dept">{lang === 'ar' ? 'القسم' : 'Department'}</label>
                  <select id="m-dept" value={form.departmentId || ''} onChange={e => setForm({...form, departmentId: e.target.value})}>
                    <option value="">{lang === 'ar' ? '-- اختر القسم --' : '-- Select Department --'}</option>
                    {departments.map(d => <option key={d.id} value={d.id}>{lang === 'ar' ? (d.nameAr || d.name) : d.name}</option>)}
                  </select>
                </div>
                <div className="form-group">
                  <label htmlFor="m-supervisor">{lang === 'ar' ? 'المشرف المباشر' : 'Direct Supervisor'}</label>
                  <select
                    id="m-supervisor"
                    value={form.reportsToId || ''}
                    onChange={e => setForm({...form, reportsToId: e.target.value ? parseInt(e.target.value) : null})}
                    disabled={managersLoading}
                  >
                    <option value="">{lang === 'ar' ? '-- بدون مشرف --' : '-- None / Root --'}</option>
                    {managersLoading
                      ? <option disabled>{lang === 'ar' ? 'جاري التحميل...' : 'Loading...'}</option>
                      : eligibleManagers.map(m => <option key={m.id} value={m.id}>{m.name} ({tRole(m.role, lang)})</option>)
                    }
                  </select>
                </div>
              </div>
            </div>
            <div className="modal-footer">
              <button className="btn btn-ghost" onClick={close}>{t('cancel')}</button>
              <button className="btn btn-primary" onClick={handleSave}>
                <i className="fa-solid fa-save" aria-hidden="true"></i> {t('saveChanges')}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── Tasks ─────────────────────────────────────────────────────────
const emptyTask = { title:'', description:'', status:'todo', priority:'Medium', assignee:'', dueDate:'' };

function Tasks({ tasks, setTasks, members, t, lang }) {
  const [modal, setModal] = useState(false);
  const [form, setForm]   = useState(emptyTask);

  const cols = [
    { key:'todo',       labelKey:'colTodo',       dot:'var(--text-dim)'  },
    { key:'inprogress', labelKey:'colInprogress',  dot:'var(--warning)'   },
    { key:'done',       labelKey:'colDone',         dot:'var(--success)'   },
  ];

  const moveTask = async (task, newStatus) => {
    const res = await authFetch(`${API}/api/tasks/${task.id}`, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({...task,status:newStatus}) });
    const updated = await res.json();
    setTasks(prev => prev.map(t => t.id === task.id ? updated : t));
  };

  const deleteTask = async (id) => {
    if (!confirm(t('confirmDeleteTask'))) return;
    const res = await authFetch(`${API}/api/tasks/${id}`, { method:'DELETE' });
    if (!res.ok) { const e = await res.json().catch(() => ({})); return alert(e.error || 'Delete failed'); }
    setTasks(prev => prev.filter(t => t.id !== id));
  };

  const saveTask = async () => {
    if (!form.title) return alert(lang === 'ar' ? 'العنوان مطلوب.' : 'Title is required.');
    const res = await authFetch(`${API}/api/tasks`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(form) });
    const created = await res.json();
    setTasks(prev => [...prev, created]);
    setModal(false);
    setForm(emptyTask);
  };

  return (
    <div>
      <div className="toolbar">
        <span style={{fontSize:12,color:'var(--text-dim)'}}>
          <i className="fa-solid fa-circle-info" style={{marginRight:6, marginLeft:6}} aria-hidden="true"></i>
          {t('taskHint')}
        </span>
        <button className="btn btn-primary" onClick={() => setModal(true)}>
          <i className="fa-solid fa-plus" aria-hidden="true"></i> {t('newTask')}
        </button>
      </div>
      <div className="kanban" role="region" aria-label="Task kanban board">
        {cols.map(col => {
          const colTasks = tasks.filter(t => t.status === col.key);
          return (
            <div className="kanban-col" key={col.key} aria-label={`${t(col.labelKey)} column`}>
              <div className="kanban-col-header">
                <div className="kanban-col-title">
                  <div className="col-dot" style={{background:col.dot}} aria-hidden="true"></div>
                  {t(col.labelKey)}
                </div>
                <span className="col-count" aria-label={`${colTasks.length} tasks`}>{colTasks.length}</span>
              </div>
              {colTasks.length === 0
                ? <div className="empty-state" style={{padding:'24px 10px'}}>
                    <i className="fa-regular fa-clipboard" aria-hidden="true"></i>
                    <p>{t('noTasksHere')}</p>
                  </div>
                : colTasks.map(task => (
                  <article className="task-card" key={task.id}>
                    <div className="task-card-title">{task.title}</div>
                    {task.description && <div className="task-card-desc">{task.description}</div>}
                    <div className="task-card-footer">
                      <div className="task-meta-row">
                        <span className={`badge badge-${task.priority.toLowerCase()}`}>
                          {task.priority === 'High' ? t('priorityHigh') : task.priority === 'Medium' ? t('priorityMedium') : t('priorityLow')}
                        </span>
                        {task.assignee && <div className="task-card-meta"><i className="fa-solid fa-user" aria-hidden="true" style={{marginInlineEnd: 4}}></i>{task.assignee}</div>}
                        {task.dueDate  && <div className="task-card-meta"><i className="fa-regular fa-calendar" aria-hidden="true" style={{marginInlineEnd: 4}}></i>{task.dueDate}</div>}
                      </div>
                      <div className="task-actions">
                        {col.key !== 'todo' && (
                          <button className="move-btn" onClick={() => moveTask(task, col.key==='done'?'inprogress':'todo')} aria-label="Move to previous column">
                            {t('btnBack')}
                          </button>
                        )}
                        {col.key !== 'done' && (
                          <button className="move-btn" onClick={() => moveTask(task, col.key==='todo'?'inprogress':'done')} aria-label="Move to next column">
                            {t('btnNext')}
                          </button>
                        )}
                        <button className="move-btn del" onClick={() => deleteTask(task.id)} aria-label={`Delete task: ${task.title}`}>
                          {t('btnDelete')}
                        </button>
                      </div>
                    </div>
                  </article>
                ))
              }
            </div>
          );
        })}
      </div>

      {modal && (
        <div className="modal-overlay" onClick={() => setModal(false)} role="dialog" aria-modal="true" aria-labelledby="task-modal-title">
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h3 id="task-modal-title">{t('newTask')}</h3>
              <button className="btn btn-ghost btn-sm btn-icon" onClick={() => setModal(false)} aria-label="Close dialog">
                <i className="fa-solid fa-times" aria-hidden="true"></i>
              </button>
            </div>
            <div className="modal-body">
              <div className="form-group">
                <label htmlFor="t-title">{t('taskTitle')}</label>
                <input id="t-title" value={form.title} onChange={e => setForm({...form,title:e.target.value})} placeholder={lang === 'ar' ? 'عنوان المهمة' : 'Task title'} autoFocus />
              </div>
              <div className="form-group">
                <label htmlFor="t-desc">{t('taskDesc')}</label>
                <textarea id="t-desc" value={form.description} onChange={e => setForm({...form,description:e.target.value})} placeholder={lang === 'ar' ? 'صف المهمة...' : 'Describe the task…'} />
              </div>
              <div className="form-row">
                <div className="form-group">
                  <label htmlFor="t-status">{t('taskStatus')}</label>
                  <select id="t-status" value={form.status} onChange={e => setForm({...form,status:e.target.value})}>
                    <option value="todo">{t('colTodo')}</option>
                    <option value="inprogress">{t('colInprogress')}</option>
                    <option value="done">{t('colDone')}</option>
                  </select>
                </div>
                <div className="form-group">
                  <label htmlFor="t-priority">{t('taskPriority')}</label>
                  <select id="t-priority" value={form.priority} onChange={e => setForm({...form,priority:e.target.value})}>
                    <option value="High">{t('priorityHigh')}</option>
                    <option value="Medium">{t('priorityMedium')}</option>
                    <option value="Low">{t('priorityLow')}</option>
                  </select>
                </div>
              </div>
              <div className="form-row">
                <div className="form-group">
                  <label htmlFor="t-assignee">{t('taskAssignee')}</label>
                  <select id="t-assignee" value={form.assignee} onChange={e => setForm({...form,assignee:e.target.value})}>
                    <option value="">{t('unassigned')}</option>
                    {members.map(m => <option key={m.id} value={m.name}>{m.name}</option>)}
                  </select>
                </div>
                <div className="form-group">
                  <label htmlFor="t-due">{t('taskDueDate')}</label>
                  <input id="t-due" type="date" value={form.dueDate} onChange={e => setForm({...form,dueDate:e.target.value})} />
                </div>
              </div>
            </div>
            <div className="modal-footer">
              <button className="btn btn-ghost" onClick={() => setModal(false)}>{t('cancel')}</button>
              <button className="btn btn-primary" onClick={saveTask}>

// ── Org Chart Node (Recursive) ───────────────────────────────────
function OrgTreeNode({ node, onSelect, expandedNodes, toggleExpand, searchTerm, selectedNodeId, t, lang,
                       canDrag, rootId, draggingId, dropTargetId, onDragStart, onDragEnd, onDragOver, onDragLeave, onDrop }) {
  const isExpanded = expandedNodes[node.id] !== false; // defaults to true
  const hasChildren = node.children && node.children.length > 0;
  
  const matchesSearch = searchTerm && (
    node.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
    (node.title && node.title.toLowerCase().includes(searchTerm.toLowerCase())) ||
    (node.department && node.department.toLowerCase().includes(searchTerm.toLowerCase()))
  );

  const isSelected = selectedNodeId === node.id;

  let cardClass = "org-node-card";
  let roleClass = "badge-member";
  let roleIcon = "fa-user";
  const _lv = clientLevelOf(node.role);
  if (_lv >= 4) {
    cardClass += " type-ceo";
    roleClass = "badge-lv4";
    roleIcon = node.role === 'CEO' ? "fa-crown" : "fa-star";
  } else if (_lv === 3) {
    cardClass += " type-manager";
    roleClass = "badge-lv3";
    roleIcon = "fa-users-gear";
  } else if (_lv === 2) {
    cardClass += " type-manager";
    roleClass = "badge-lv2";
    roleIcon = "fa-user-tie";
  } else {
    cardClass += " type-employee";
    roleClass = "badge-lv1";
    roleIcon = "fa-user";
  }
  
  if (matchesSearch) {
    cardClass += " org-node-highlight";
  }

  const selectNode = (e) => {
    e.stopPropagation();
    onSelect(node);
  };
  const isDraggable = canDrag && node.id !== rootId;
  const isDragSource = draggingId === node.id;
  const isDropTarget = dropTargetId === node.id && !isDragSource;
  if (isDragSource) cardClass += ' drag-source';
  if (isDropTarget) cardClass += ' drop-target';

  return (
    <div className="org-tree-node-wrapper">
      <div
        className={cardClass}
        onClick={selectNode}
        draggable={isDraggable}
        onDragStart={isDraggable ? (e) => { e.stopPropagation(); onDragStart(node.id); } : undefined}
        onDragEnd={isDraggable ? (e) => { e.stopPropagation(); onDragEnd(); } : undefined}
        onDragOver={canDrag && !isDragSource ? (e) => { e.preventDefault(); e.stopPropagation(); onDragOver(node.id); } : undefined}
        onDragLeave={canDrag ? (e) => { e.stopPropagation(); onDragLeave(node.id); } : undefined}
        onDrop={canDrag && !isDragSource ? (e) => { e.preventDefault(); e.stopPropagation(); onDrop(node.id); } : undefined}
        style={isSelected && !isDropTarget ? { borderColor: 'var(--accent)', borderWidth: '1.5px', boxShadow: '0 0 0 2px var(--accent-glow), 0 12px 24px rgba(59, 130, 246, 0.25)' } : {}}
      >
        <div className="org-node-header">
          <span className={`badge ${roleClass}`}>
            <i className={`fa-solid ${roleIcon}`} style={{ marginInlineEnd: 4 }} aria-hidden="true"></i>
            {tRole(node.role, lang)}
          </span>
          {node.department && <span className="org-node-dept">{lang === 'ar' ? (node.departmentAr || node.department) : node.department}</span>}
        </div>
        <div className="org-node-body">
          <div className={`avatar ${getColor(node.name)}`} style={{ width: 34, height: 34, fontSize: 11 }} aria-hidden="true">
            {initials(node.name)}
          </div>
          <div className="org-node-info">
            <h4 className="org-node-name">{node.name}</h4>
            <p className="org-node-title">{node.title || (lang === 'ar' ? 'عضو الفريق' : 'Team Member')}</p>
          </div>
        </div>
        {hasChildren && (
          <button 
            className="org-node-toggle-btn"
            onClick={(e) => {
              e.stopPropagation();
              toggleExpand(node.id);
            }}
            aria-label={isExpanded ? "Collapse branch" : "Expand branch"}
          >
            <i className={`fa-solid ${isExpanded ? 'fa-minus' : 'fa-plus'}`} aria-hidden="true"></i>
          </button>
        )}
      </div>

      {hasChildren && isExpanded && (
        <div className="org-tree-children" role="group">
          {node.children.map(child => (
            <div className="org-tree-child" key={child.id}>
              <OrgTreeNode
                node={child}
                onSelect={onSelect}
                expandedNodes={expandedNodes}
                toggleExpand={toggleExpand}
                searchTerm={searchTerm}
                selectedNodeId={selectedNodeId}
                t={t} lang={lang}
                canDrag={canDrag} rootId={rootId}
                draggingId={draggingId} dropTargetId={dropTargetId}
                onDragStart={onDragStart} onDragEnd={onDragEnd}
                onDragOver={onDragOver} onDragLeave={onDragLeave} onDrop={onDrop}
              />
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// Tree Helper Operations
function addChildToNode(root, parentId, child) {
  if (root.id === parentId) {
    return {
      ...root,
      children: [...(root.children || []), child]
    };
  }
  if (root.children) {
    return {
      ...root,
      children: root.children.map(c => addChildToNode(c, parentId, child))
    };
  }
  return root;
}

function updateNodeInTree(root, nodeId, updatedFields) {
  if (root.id === nodeId) {
    return {
      ...root,
      ...updatedFields
    };
  }
  if (root.children) {
    return {
      ...root,
      children: root.children.map(c => updateNodeInTree(c, nodeId, updatedFields))
    };
  }
  return root;
}

function deleteNodeFromTree(root, nodeId, promoteChildren) {
  if (!root.children) return root;
  
  const idx = root.children.findIndex(c => c.id === nodeId);
  if (idx !== -1) {
    const target = root.children[idx];
    let newChildren = [...root.children];
    
    if (promoteChildren && target.children && target.children.length > 0) {
      newChildren.splice(idx, 1, ...target.children);
    } else {
      newChildren.splice(idx, 1);
    }
    return {
      ...root,
      children: newChildren
    };
  }
  
  return {
    ...root,
    children: root.children.map(c => deleteNodeFromTree(c, nodeId, promoteChildren))
  };
}

function findNodeById(root, id) {
  if (root.id === id) return root;
  if (root.children) {
    for (const child of root.children) {
      const found = findNodeById(child, id);
      if (found) return found;
    }
  }
  return null;
}

function OrgChart({ t, lang, members, user }) {
  const [orgData, setOrgData] = useState(defaultOrgData);
  const [selectedNode, setSelectedNode] = useState(defaultOrgData);
  const [searchTerm, setSearchTerm] = useState('');
  const [zoom, setZoom] = useState(1);
  const [pan, setPan] = useState({ x: 100, y: 50 });
  const [isDragging, setIsDragging] = useState(false);
  const [dragStart, setDragStart] = useState({ x: 0, y: 0 });
  const [expandedNodes, setExpandedNodes] = useState({});
  const [viewMode, setViewMode] = useState('chart'); // 'chart' | 'json'
  const [jsonInput, setJsonInput] = useState('');
  const [jsonError, setJsonError] = useState(null);
  const [nodeDraggingId, setNodeDraggingId] = useState(null);
  const [nodeDropTargetId, setNodeDropTargetId] = useState(null);

  const [isEditModalOpen, setIsEditModalOpen] = useState(false);
  const [isAddModalOpen, setIsAddModalOpen] = useState(false);
  const [nodeForm, setNodeForm] = useState({ name: '', title: '', role: 'Employee', email: '', phone: '', department: '' });

  const viewportRef = useRef(null);
  const canDragNodes = (user?.accessLevel || clientLevelOf(user?.role)) >= 4;

  const fetchOrgChart = () => {
    authFetch(`${API}/api/org-chart`)
      .then(r => r.json())
      .then(data => { if (data && data.id) { setOrgData(data); setSelectedNode(s => findNodeById(data, s?.id) || data); } })
      .catch(() => {});
  };

  // Fetch on mount and re-fetch whenever member count changes (add/remove)
  useEffect(() => { fetchOrgChart(); }, [members.length]);

  const handleNodeDrop = async (targetId) => {
    if (!nodeDraggingId || !targetId || nodeDraggingId === targetId) {
      setNodeDraggingId(null); setNodeDropTargetId(null); return;
    }
    const res = await authFetch(`${API}/api/members/${nodeDraggingId}/reparent`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ reportsToId: parseInt(targetId) }),
    });
    setNodeDraggingId(null); setNodeDropTargetId(null);
    if (!res.ok) { const e = await res.json().catch(() => ({})); return alert(e.error || 'Failed to move'); }
    fetchOrgChart();
  };

  useEffect(() => {
    setJsonInput(JSON.stringify(orgData, null, 2));
  }, [orgData]);

  const handleMouseDown = (e) => {
    if (e.target.closest('.org-node-card') || e.target.closest('button') || e.target.closest('input') || e.target.closest('textarea')) return;
    setIsDragging(true);
    setDragStart({ x: e.clientX - pan.x, y: e.clientY - pan.y });
  };

  const handleMouseMove = (e) => {
    if (!isDragging) return;
    setPan({
      x: e.clientX - dragStart.x,
      y: e.clientY - dragStart.y
    });
  };

  const handleMouseUp = () => {
    setIsDragging(false);
  };

  const handleWheel = (e) => {
    const zoomFactor = 0.05;
    let newZoom = zoom - e.deltaY * zoomFactor * 0.005;
    newZoom = Math.max(0.4, Math.min(2.0, newZoom));
    setZoom(newZoom);
  };

  const resetView = () => {
    setZoom(1);
    setPan({ x: 100, y: 50 });
  };

  const setAllNodesExpansion = (expand) => {
    const newExpanded = {};
    const traverse = (node) => {
      newExpanded[node.id] = expand;
      if (node.children) {
        node.children.forEach(traverse);
      }
    };
    traverse(orgData);
    setExpandedNodes(newExpanded);
  };

  const handleSelectNode = (node) => {
    setSelectedNode(node);
  };

  const handleOpenEdit = () => {
    setNodeForm({
      name: selectedNode.name,
      title: selectedNode.title || '',
      role: selectedNode.role || 'Employee',
      email: selectedNode.email || '',
      phone: selectedNode.phone || '',
      department: selectedNode.department || ''
    });
    setIsEditModalOpen(true);
  };

  const handleSaveEdit = () => {
    if (!nodeForm.name) return alert(lang === 'ar' ? 'الاسم مطلوب.' : 'Name is required.');
    const updated = updateNodeInTree(orgData, selectedNode.id, nodeForm);
    setOrgData(updated);
    setIsEditModalOpen(false);
    setSelectedNode({ ...selectedNode, ...nodeForm });
  };

  const handleOpenAdd = () => {
    setNodeForm({ name: '', title: '', role: 'Employee', email: '', phone: '', department: selectedNode.department || '' });
    setIsAddModalOpen(true);
  };

  const handleSaveAdd = () => {
    if (!nodeForm.name) return alert(lang === 'ar' ? 'الاسم مطلوب.' : 'Name is required.');
    const newId = 'emp_' + Math.random().toString(36).substr(2, 9);
    const newNode = {
      id: newId,
      ...nodeForm,
      children: []
    };
    const updated = addChildToNode(orgData, selectedNode.id, newNode);
    setOrgData(updated);
    setIsAddModalOpen(false);
  };

  const handleDeleteNode = (promote) => {
    if (selectedNode.id === orgData.id) {
      alert(t('ceoCannotDelete'));
      return;
    }
    if (!confirm(t('confirmDeleteNode', { name: selectedNode.name }))) return;
    const updated = deleteNodeFromTree(orgData, selectedNode.id, promote);
    setOrgData(updated);
    setSelectedNode(orgData); // reset selection to CEO
  };

  const handleSaveJson = () => {
    try {
      const parsed = JSON.parse(jsonInput);
      if (!parsed.id || !parsed.name) {
        throw new Error('Invalid schema. The root node must have at least "id" and "name".');
      }
      setOrgData(parsed);
      setJsonError(null);
      setViewMode('chart');
    } catch (e) {
      setJsonError(e.message);
    }
  };

  useEffect(() => {
    if (selectedNode) {
      const exists = findNodeById(orgData, selectedNode.id);
      if (!exists) {
        setSelectedNode(orgData);
      } else {
        setSelectedNode(exists);
      }
    }
  }, [orgData]);

  return (
    <div className="org-layout">
      {/* Visual Canvas Panel */}
      <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <div className="search-bar" style={{ flex: 1, maxWidth: 300 }} role="search">
            <i className="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
            <input 
              placeholder={t('searchChart')} 
              value={searchTerm}
              onChange={e => setSearchTerm(e.target.value)} 
              aria-label="Search organizational chart" 
            />
          </div>
          
          <div style={{ display: 'flex', gap: 8 }}>
            <button 
              className={`btn ${viewMode === 'chart' ? 'btn-primary' : 'btn-ghost'}`} 
              onClick={() => setViewMode('chart')}
            >
              <i className="fa-solid fa-sitemap" style={{ marginRight: 6, marginLeft: 6 }} aria-hidden="true"></i>
              {t('visualChart')}
            </button>
            <button 
              className={`btn ${viewMode === 'json' ? 'btn-primary' : 'btn-ghost'}`} 
              onClick={() => {
                setViewMode('json');
                setJsonInput(JSON.stringify(orgData, null, 2));
                setJsonError(null);
              }}
            >
              <i className="fa-solid fa-code" style={{ marginRight: 6, marginLeft: 6 }} aria-hidden="true"></i>
              {t('jsonEditor')}
            </button>
          </div>
        </div>

        {viewMode === 'chart' ? (
          <div 
            className="org-chart-viewport" 
            ref={viewportRef}
            onMouseDown={handleMouseDown}
            onMouseMove={handleMouseMove}
            onMouseUp={handleMouseUp}
            onMouseLeave={handleMouseUp}
            onWheel={handleWheel}
          >
            <div className="org-controls" aria-label="Chart controls">
              <button className="btn-icon" onClick={() => setZoom(prev => Math.min(2.0, prev + 0.1))} aria-label={t('zoomIn')}>
                <i className="fa-solid fa-plus" aria-hidden="true"></i>
              </button>
              <button className="btn-icon" onClick={() => setZoom(prev => Math.max(0.4, prev - 0.1))} aria-label={t('zoomOut')}>
                <i className="fa-solid fa-minus" aria-hidden="true"></i>
              </button>
              <button className="btn-icon" onClick={resetView} aria-label={t('resetZoom')}>
                <i className="fa-solid fa-expand" aria-hidden="true"></i>
              </button>
              <div style={{ width: 1, background: 'var(--border-sub)', margin: '0 4px' }}></div>
              <button className="btn-icon" onClick={() => setAllNodesExpansion(true)} aria-label={t('expandAll')}>
                <i className="fa-solid fa-angles-down" aria-hidden="true"></i>
              </button>
              <button className="btn-icon" onClick={() => setAllNodesExpansion(false)} aria-label={t('collapseAll')}>
                <i className="fa-solid fa-angles-up" aria-hidden="true"></i>
              </button>
            </div>

            {canDragNodes && (
              <div className="drag-hint" style={{marginBottom:8}}>
                <i className="fa-solid fa-up-down-left-right"></i>
                {lang === 'ar' ? 'اسحب أي موظف وأفلته على موظف آخر لتغيير مرجعيته' : 'Drag any card and drop onto another to change reporting line'}
              </div>
            )}

            <div
              className="org-chart-canvas"
              style={{
                transform: `translate(${pan.x}px, ${pan.y}px) scale(${zoom})`
              }}
            >
              <OrgTreeNode
                node={orgData}
                onSelect={handleSelectNode}
                expandedNodes={expandedNodes}
                toggleExpand={(id) => setExpandedNodes(prev => ({ ...prev, [id]: prev[id] === false }))}
                searchTerm={searchTerm}
                selectedNodeId={selectedNode ? selectedNode.id : null}
                t={t} lang={lang}
                canDrag={canDragNodes} rootId={orgData.id}
                draggingId={nodeDraggingId} dropTargetId={nodeDropTargetId}
                onDragStart={(id) => setNodeDraggingId(id)}
                onDragEnd={() => { setNodeDraggingId(null); setNodeDropTargetId(null); }}

// ── News Approvals ──────────────────────────────────────────────
function NewsApprovals({ t, lang, user }) {
  const [pending, setPending] = useState([]);
  const [loadingState, setLoadingState] = useState(true);
  const [actionInFlight, setActionInFlight] = useState(null);

  const fetchPending = async () => {
    setLoadingState(true);
    try {
      const res = await authFetch(`${API}/api/news/pending`);
      const data = await res.json();
      setPending(data || []);
    } catch { setPending([]); }
    setLoadingState(false);
  };

  useEffect(() => { fetchPending(); }, []);

  const handleApprove = async (id) => {
    setActionInFlight(id);
    try {
      const res = await authFetch(`${API}/api/news/${id}/approve`, { method: 'PATCH' });
      if (res.ok) {
        setPending(prev => prev.filter(n => n.id !== id));
        alert(t('newsApproved'));
      }
    } catch { alert(lang === 'ar' ? 'خطأ في الشبكة.' : 'Network error.'); }
    setActionInFlight(null);
  };

  const handleReject = async (id) => {
    if (!confirm(lang === 'ar' ? 'هل أنت متأكد من رفض هذا الخبر؟' : 'Are you sure you want to reject this post?')) return;
    setActionInFlight(id);
    try {
      const res = await authFetch(`${API}/api/news/${id}/reject`, { method: 'PATCH' });
      if (res.ok) {
        setPending(prev => prev.filter(n => n.id !== id));
        alert(t('newsRejected'));
      }
    } catch { alert(lang === 'ar' ? 'خطأ في الشبكة.' : 'Network error.'); }
    setActionInFlight(null);
  };

  const getTagClass = (tag) => {
    const tl = (tag || '').toLowerCase();
    if (tl === 'system') return 'tag-system';
    if (tl === 'notice') return 'tag-notice';
    if (tl === 'finance') return 'tag-finance';
    if (tl === 'campaign') return 'tag-campaign';
    if (tl === 'audit') return 'tag-audit';
    return 'tag-general';
  };

  if (loadingState) {
    return (
      <div style={{textAlign:'center',padding:80,color:'var(--text-dim)'}} role="status">
        <i className="fa-solid fa-circle-notch fa-spin" style={{fontSize:28,color:'var(--accent)'}} aria-hidden="true"></i>
        <p style={{marginTop:14,fontSize:13}}>{t('loading')}</p>
      </div>
    );
  }

  return (
    <div>
      <div className="card" style={{ padding: '24px' }}>
        <div className="section-title" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px' }}>
          <span>
            <i className="fa-solid fa-clock-rotate-left" style={{ marginRight: '8px', marginLeft: '8px', color: 'var(--accent)' }} aria-hidden="true"></i>
            {t('pendingApproval')}
          </span>
          <span className="badge" style={{
            background: 'linear-gradient(135deg, var(--accent), #a855f7)',
            color: '#fff', borderRadius: '20px', padding: '4px 14px', fontSize: '12px', fontWeight: 600
          }}>{pending.length}</span>
        </div>

        {pending.length === 0 ? (
          <div className="empty-state" style={{ padding: '60px 20px', textAlign: 'center' }}>
            <i className="fa-regular fa-circle-check" style={{ fontSize: '38px', color: 'var(--accent)', marginBottom: '14px', display: 'block' }} aria-hidden="true"></i>
            <p style={{ color: 'var(--text-dim)', fontSize: '14px' }}>{t('noPendingNews')}</p>
          </div>
        ) : (
          <div style={{ display: 'grid', gap: '16px' }}>
            {pending.map(item => (
              <div key={item.id} className="card" style={{
                padding: '20px',
                border: '1px solid var(--border-sub)',
                borderLeft: '4px solid #f59e0b',
                borderRadius: '12px',
                background: 'var(--bg-surface)',
                transition: 'transform 0.2s ease, box-shadow 0.2s ease',
              }}
              onMouseEnter={e => { e.currentTarget.style.transform = 'translateY(-2px)'; e.currentTarget.style.boxShadow = '0 8px 25px rgba(0,0,0,0.15)'; }}
              onMouseLeave={e => { e.currentTarget.style.transform = 'translateY(0)'; e.currentTarget.style.boxShadow = 'none'; }}
              >
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '12px' }}>
                  <div style={{ flex: 1 }}>
                    <h4 style={{ margin: '0 0 6px', color: 'var(--text)', fontSize: '15px', fontWeight: 600 }}>{item.title}</h4>
                    <div style={{ display: 'flex', gap: '8px', alignItems: 'center', flexWrap: 'wrap' }}>
                      <span style={{ fontSize: '12px', color: 'var(--text-dim)' }}>
                        <i className="fa-regular fa-user" style={{ marginRight: '4px', marginLeft: '4px' }} aria-hidden="true"></i>
                        {t('submittedBy')}: <strong>{item.author}</strong>
                      </span>
                      <span style={{ fontSize: '12px', color: 'var(--text-dim)' }}>
                        <i className="fa-regular fa-calendar" style={{ marginRight: '4px', marginLeft: '4px' }} aria-hidden="true"></i>
                        {item.date}
                      </span>
                      {item.tags && item.tags.map(tg => (
                        <span key={tg} className={`tag ${getTagClass(tg)}`}>{tg}</span>
                      ))}
                    </div>
                  </div>
                  <span className="badge" style={{
                    background: 'rgba(245,158,11,0.15)', color: '#f59e0b',
                    borderRadius: '8px', padding: '4px 10px', fontSize: '11px', fontWeight: 600,
                    whiteSpace: 'nowrap',
                  }}>
                    <i className="fa-solid fa-hourglass-half" style={{ marginRight: '4px', marginLeft: '4px' }} aria-hidden="true"></i>
                    {t('pendingApproval')}
                  </span>
                </div>

                <p style={{ margin: '0 0 16px', color: 'var(--text-dim)', fontSize: '13px', lineHeight: '1.7' }}>{item.content}</p>

                <div style={{ display: 'flex', gap: '10px', justifyContent: 'flex-end' }}>
                  <button
                    className="btn btn-sm"
                    disabled={actionInFlight === item.id}
                    onClick={() => handleReject(item.id)}
                    style={{
                      background: 'rgba(239,68,68,0.1)', color: '#ef4444', border: '1px solid rgba(239,68,68,0.3)',
                      borderRadius: '8px', padding: '6px 18px', fontWeight: 600, cursor: 'pointer',
                      transition: 'all 0.2s ease',
                    }}
                    onMouseEnter={e => { e.currentTarget.style.background = '#ef4444'; e.currentTarget.style.color = '#fff'; }}
                    onMouseLeave={e => { e.currentTarget.style.background = 'rgba(239,68,68,0.1)'; e.currentTarget.style.color = '#ef4444'; }}
                  >
                    <i className="fa-solid fa-xmark" style={{ marginRight: '4px', marginLeft: '4px' }} aria-hidden="true"></i>
                    {t('rejectPost')}
                  </button>
                  <button
                    className="btn btn-primary btn-sm"
                    disabled={actionInFlight === item.id}
                    onClick={() => handleApprove(item.id)}
                    style={{
                      background: 'linear-gradient(135deg, #22c55e, #16a34a)', color: '#fff', border: 'none',
                      borderRadius: '8px', padding: '6px 18px', fontWeight: 600, cursor: 'pointer',
                      transition: 'all 0.2s ease', boxShadow: '0 2px 8px rgba(34,197,94,0.3)',
                    }}
                    onMouseEnter={e => { e.currentTarget.style.boxShadow = '0 4px 14px rgba(34,197,94,0.45)'; }}
                    onMouseLeave={e => { e.currentTarget.style.boxShadow = '0 2px 8px rgba(34,197,94,0.3)'; }}
                  >
                    <i className="fa-solid fa-check" style={{ marginRight: '4px', marginLeft: '4px' }} aria-hidden="true"></i>
                    {t('approvePost')}
                  </button>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

// ── Documents ──────────────────────────────────────────────────
function Documents({ t, lang, user }) {
  const [docs, setDocs] = useState([]);
  const [loadingDocs, setLoadingDocs] = useState(true);
  const [searchQuery, setSearchQuery] = useState('');
  const [selectedDoc, setSelectedDoc] = useState(null);
  const [uploadModalOpen, setUploadModalOpen] = useState(false);
  const [uploadForm, setUploadForm] = useState({
    title: '',
    description: '',
    filename: '',
    url: '',
    minAccessLevel: 1
  });
  const [submitting, setSubmitting] = useState(false);

  const fetchDocs = async () => {
    setLoadingDocs(true);
    try {
      const res = await authFetch(`${API}/api/documents`);
      const data = await res.json();
      setDocs(data || []);
    } catch {
      setDocs([]);
    }
    setLoadingDocs(false);
  };

  useEffect(() => {
    fetchDocs();
  }, []);

  const handleCreateDoc = async (e) => {
    e.preventDefault();
    if (!uploadForm.title.trim()) return alert(t('loginErrorEmpty'));
    setSubmitting(true);
    try {
      const res = await authFetch(`${API}/api/documents`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(uploadForm)
      });
      if (res.ok) {
        setUploadForm({ title: '', description: '', filename: '', url: '', minAccessLevel: 1 });
        setUploadModalOpen(false);
        fetchDocs();
      } else {
        const err = await res.json();
        alert(err.error || 'Error uploading document');
      }
    } catch {
      alert(lang === 'ar' ? 'خطأ في الاتصال بالخادم.' : 'Connection error.');
    }
    setSubmitting(false);
  };

  const handleDeleteDoc = async (e, id, title) => {
    e.stopPropagation();
    if (!confirm(t('confirmDeleteDocument', { title }))) return;
    try {
      const res = await authFetch(`${API}/api/documents/${id}`, { method: 'DELETE' });
      if (res.ok) {
        fetchDocs();
        if (selectedDoc?.id === id) setSelectedDoc(null);
      }
    } catch {
      alert(lang === 'ar' ? 'خطأ في الاتصال بالخادم.' : 'Connection error.');
    }
  };

  const getDocIcon = (filename) => {
    const fn = (filename || '').toLowerCase();
    if (fn.endsWith('.pdf')) return { cls: 'pdf', icon: 'fa-regular fa-file-pdf' };
    if (fn.match(/\.(png|jpg|jpeg|gif|webp|svg)$/)) return { cls: 'image', icon: 'fa-regular fa-file-image' };
    if (fn.match(/\.(xls|xlsx|csv)$/)) return { cls: 'sheet', icon: 'fa-regular fa-file-excel' };
    return { cls: 'other', icon: 'fa-regular fa-file-lines' };
  };

  const getDocCategory = (filename) => {
    const fn = (filename || '').toLowerCase();
    if (fn.endsWith('.pdf')) return lang === 'ar' ? 'مستند PDF' : 'PDF Document';
    if (fn.match(/\.(png|jpg|jpeg|gif|webp|svg)$/)) return lang === 'ar' ? 'صورة' : 'Image';
    if (fn.match(/\.(xls|xlsx|csv)$/)) return lang === 'ar' ? 'ورقة عمل' : 'Spreadsheet';
    return lang === 'ar' ? 'ملف' : 'File';
  };

  const getMockSize = (id) => {
    const sizes = ['1.4 MB', '4.2 MB', '890 KB', '15.6 MB', '2.8 MB', '670 KB', '5.1 MB'];
    const idx = typeof id === 'number' ? id : (id || '').charCodeAt(0) || 0;
    return sizes[idx % sizes.length];
  };

  const getAccessLabel = (lvl) => {
    if (lvl === 4) return lang === 'ar' ? 'المستوى 4 (الإدارة التنفيذية)' : 'Level 4 (Executive Management)';
    if (lvl === 3) return lang === 'ar' ? 'المستوى 3+ (نواب الرئيس والمدراء الكبار)' : 'Level 3+ (VPs & Senior Managers)';
    if (lvl === 2) return lang === 'ar' ? 'المستوى 2+ (المدراء والمشرفين)' : 'Level 2+ (Managers & Supervisors)';
    return lang === 'ar' ? 'المستوى 1+ (جميع الموظفين)' : 'Level 1+ (All Employees)';
  };

  const filteredDocs = docs.filter(doc => 
    (doc.title || '').toLowerCase().includes(searchQuery.toLowerCase()) || 
    (doc.filename || '').toLowerCase().includes(searchQuery.toLowerCase())
  );

  if (loadingDocs) {
    return (
      <div style={{ textAlign: 'center', padding: 80, color: 'var(--text-dim)' }} role="status">
        <i className="fa-solid fa-circle-notch fa-spin" style={{ fontSize: 28, color: 'var(--accent)' }} aria-hidden="true"></i>
        <p style={{ marginTop: 14, fontSize: 13 }}>{t('loading')}</p>
      </div>
    );
  }

  const isImage = (filename) => (filename || '').toLowerCase().match(/\.(png|jpg|jpeg|gif|webp|svg)$/);
  const isPdf = (filename) => (filename || '').toLowerCase().endsWith('.pdf');

  return (
    <div>
      <div className="card" style={{ padding: '24px' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px', flexWrap: 'wrap', gap: '12px' }}>
          <div className="search-bar" style={{ display: 'flex', alignItems: 'center', background: 'var(--bg-input)', border: '1px solid var(--border)', borderRadius: 'var(--radius-sm)', padding: '0 12px', width: '300px' }}>
            <i className="fa-solid fa-magnifying-glass" style={{ color: 'var(--text-dim)', marginInlineEnd: '8px' }} aria-hidden="true"></i>
            <input 
              type="text" 
              placeholder={t('searchDocuments')} 
              value={searchQuery} 
              onChange={e => setSearchQuery(e.target.value)}
              style={{ background: 'none', border: 'none', color: 'var(--text)', outline: 'none', padding: '10px 0', fontSize: '13px', width: '100%' }}
            />
          </div>
          {user?.accessLevel >= 4 && (
            <button className="btn btn-primary" onClick={() => setUploadModalOpen(true)}>
              <i className="fa-solid fa-cloud-arrow-up" style={{ marginInlineEnd: '6px' }} aria-hidden="true"></i>
              {t('addDocument')}
            </button>
          )}
        </div>

        {filteredDocs.length === 0 ? (
          <div className="empty-state" style={{ padding: '60px 20px', textAlign: 'center' }}>
            <i className="fa-regular fa-folder-open" style={{ fontSize: '38px', color: 'var(--accent)', marginBottom: '14px', display: 'block' }} aria-hidden="true"></i>
            <p style={{ color: 'var(--text-dim)', fontSize: '14px' }}>{t('noDocuments')}</p>
          </div>
        ) : (
          <div className="doc-grid">
            {filteredDocs.map(doc => {
              const fileType = getDocIcon(doc.filename);
              return (
                <div key={doc.id} className="doc-card" onClick={() => setSelectedDoc(doc)}>
                  <div className="doc-card-top">
                    <div className={`doc-icon ${fileType.cls}`}>
                      <i className={fileType.icon} aria-hidden="true"></i>
                    </div>
                    <div className="doc-info">
                      <h4 className="doc-title" title={doc.title}>{doc.title}</h4>
                      <div className="doc-filename" title={doc.filename}>{doc.filename}</div>
                    </div>
                  </div>

                  {doc.description && (
                    <p style={{ fontSize: '12px', color: 'var(--text-muted)', margin: '10px 0 0', display: '-webkit-box', WebkitLineClamp: '2', WebkitBoxOrient: 'vertical', overflow: 'hidden', height: '36px', lineHeight: '1.5' }}>
                      {doc.description}
                    </p>

                  <div className="doc-card-bottom">
                    <div className="doc-meta-item">
                      <i className="fa-regular fa-eye" aria-hidden="true"></i>

                    </div>
                    <div className="doc-meta-item">
                      <i className="fa-regular fa-calendar" aria-hidden="true"></i>

                    </div>
                    <div style={{ display: 'flex', gap: '6px' }}>
                      {user?.accessLevel >= 4 && (
                        <button className="doc-action-btn danger" onClick={(e) => handleDeleteDoc(e, doc.id, doc.title)} title={t('deleteDocument')}>
                          <i className="fa-regular fa-trash-can" aria-hidden="true"></i>
                        </button>
                      )}
                      <a href={doc.url} download={doc.filename} onClick={(e) => e.stopPropagation()} className="doc-action-btn" title={t('downloadFile')}>
                        <i className="fa-solid fa-arrow-down-to-line" aria-hidden="true"></i>
                      </a>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {/* Upload Document Modal */}
      {uploadModalOpen && (
        <div className="modal-overlay" onClick={() => setUploadModalOpen(false)}>
          <div className="modal" onClick={e => e.stopPropagation()} style={{ maxWidth: '500px' }}>
            <div className="modal-header">
              <h3>{t('addDocument')}</h3>
              <button className="btn btn-ghost btn-sm" onClick={() => setUploadModalOpen(false)} aria-label="Close">
                <i className="fa-solid fa-xmark"></i>
              </button>
            </div>
            <form onSubmit={handleCreateDoc}>
              <div className="modal-body">
                <div className="form-group">
                  <label>{t('docTitle')}</label>
                  <input 
                    type="text" 
                    required 
                    value={uploadForm.title} 
                    onChange={e => setUploadForm({ ...uploadForm, title: e.target.value })} 
                    className="login-field input"
                    style={{ width: '100%', padding: '10px', background: 'var(--bg-input)', border: '1px solid var(--border)', borderRadius: 'var(--radius-sm)', color: 'var(--text)' }}
                  />
                </div>
                <div className="form-group">
                  <label>{t('docDesc')}</label>
                  <textarea 
                    value={uploadForm.description} 
                    onChange={e => setUploadForm({ ...uploadForm, description: e.target.value })} 
                    style={{ width: '100%', padding: '10px', background: 'var(--bg-input)', border: '1px solid var(--border)', borderRadius: 'var(--radius-sm)', color: 'var(--text)', minHeight: '60px', fontFamily: 'inherit', resize: 'vertical' }}
                  />
                </div>
                <div className="form-row">
                  <div className="form-group">
                    <label>{t('docFilename')}</label>
                    <input 
                      type="text" 
                      required 
                      placeholder="report.pdf" 
                      value={uploadForm.filename} 
                      onChange={e => setUploadForm({ ...uploadForm, filename: e.target.value })}
                      style={{ width: '100%', padding: '10px', background: 'var(--bg-input)', border: '1px solid var(--border)', borderRadius: 'var(--radius-sm)', color: 'var(--text)' }}
                    />
                  </div>
                  <div className="form-group">
                    <label>{t('docMinAccess')}</label>
                    <select 
                      value={uploadForm.minAccessLevel} 
                      onChange={e => setUploadForm({ ...uploadForm, minAccessLevel: parseInt(e.target.value) })}
                      style={{ width: '100%', padding: '10px', background: 'var(--bg-input)', border: '1px solid var(--border)', borderRadius: 'var(--radius-sm)', color: 'var(--text)' }}
                    >
                      <option value="1">Level 1 (All Employees)</option>
                      <option value="2">Level 2 (Supervisors/Managers)</option>
                      <option value="3">Level 3 (VPs/Senior Managers)</option>
                      <option value="4">Level 4 (CEO/President)</option>
                    </select>
                  </div>
                </div>
                <div className="form-group">
                  <label>{t('docUrl')}</label>
                  <input 
                    type="url" 
                    required 
                    placeholder="https://example.com/file.pdf" 
                    value={uploadForm.url} 
                    onChange={e => setUploadForm({ ...uploadForm, url: e.target.value })}
                    style={{ width: '100%', padding: '10px', background: 'var(--bg-input)', border: '1px solid var(--border)', borderRadius: 'var(--radius-sm)', color: 'var(--text)' }}
                  />
                </div>
              </div>
              <div className="modal-footer">
                <button type="button" className="btn btn-ghost" onClick={() => setUploadModalOpen(false)}>{t('cancel')}</button>
                <button type="submit" className="btn btn-primary" disabled={submitting}>
                  {submitting ? <i className="fa-solid fa-circle-notch fa-spin"></i> : t('addDocument')}
                </button>
              </div>
            </form>
          </div>
        </div>
      )}

      {/* In-App Document Viewer & Embedded Info Dashboard Overlay */}
      {selectedDoc && (
        <div className="modal-overlay" onClick={() => setSelectedDoc(null)}>
          <div className="modal doc-viewer-modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                <div className={`doc-icon ${getDocIcon(selectedDoc.filename).cls}`} style={{ width: '32px', height: '32px', fontSize: '14px', borderRadius: '6px' }}>
                  <i className={getDocIcon(selectedDoc.filename).icon} aria-hidden="true"></i>
                </div>

              </div>
              <div style={{ display: 'flex', gap: '8px' }}>
                <a href={selectedDoc.url} target="_blank" rel="noopener noreferrer" className="btn btn-ghost btn-sm" title={t('downloadFile')}>
                  <i className="fa-solid fa-arrow-down-to-line" style={{ marginInlineEnd: '4px' }}></i>
                  {t('downloadFile')}
                </a>
                <button className="btn btn-ghost btn-sm" onClick={() => setSelectedDoc(null)} aria-label="Close">

                </button>

            <div className="doc-viewer-split">

                  <div className="doc-meta-card-icon">

                  </div>
                  <div className="doc-meta-card-details">

                {/* Access Level Card */}
                <div className="doc-meta-card">

                  </div>

    </div>
